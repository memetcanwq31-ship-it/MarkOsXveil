# ToolGrup OS - Ana Yapılandırma
[system]
name        = ToolGrup OS
version     = 0.2
codename    = Ozgur
arch        = i686
kernel      = markos_kernel_core.bin
independence = full        ; Linux'tan tamamen bağımsız

[boot]
timeout     = 3
default     = kernel
splash      = toolgrup.spl

[tools]
registry    = /etc/toolgrup/tools.cfg
max_tools   = 1024         ; 755 + büyüme payı
autoload    = markos-browser, shell

[browser]
name        = MarkOS Browser
engine      = markhtml     ; kendi HTML motorumuz
homepage    = markos://start
no-external = true         ; Google yok, sadece MarkOS Browser

[network]
stack       = marknet      ; kendi TCP/IP yığınımız
